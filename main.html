<!DOCTYPE html>
<html>
<head>
  <title>Size Chart</title>

  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #f5f5f5;
    }
  </style>
</head>

<body>

  <table>
    <thead>
      <tr>
        <th>Part</th>
        <th>XS</th>
        <th>S</th>
        <th>M</th>
        <th>L</th>
        <th>XL</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Chest</td>
        <td>34</td>
        <td>36</td>
        <td>38</td>
        <td>40</td>
        <td>42</td>
      </tr>

      <tr>
        <td>Waist</td>
        <td>28</td>
        <td>30</td>
        <td>32</td>
        <td>34</td>
        <td>36</td>
      </tr>

      <tr>
        <td>Hip</td>
        <td>34</td>
        <td>36</td>
        <td>38</td>
        <td>40</td>
        <td>42</td>
      </tr>

      <tr>
        <td>Length</td>
        <td>26</td>
        <td>27</td>
        <td>28</td>
        <td>29</td>
        <td>30</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
