<!DOCTYPE html>
<html>
<head>
  <title>Size Chart</title>

  <style>
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
      font-family: Arial, sans-serif;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    thead {
      background-color: #f5f5f5;
    }

    th {
      font-weight: bold;
    }

    tbody tr:nth-child(even) {
      background-color: #fafafa;
    }
  </style>
</head>

<body>

  <table>
    <thead>
      <tr>
        <th>Size</th>
        <th>Chest</th>
        <th>Waist</th>
        <th>Hip</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>XS</td>
        <td>34</td>
        <td>28</td>
        <td>34</td>
      </tr>

      <tr>
        <td>S</td>
        <td>36</td>
        <td>30</td>
        <td>36</td>
      </tr>

      <tr>
        <td>M</td>
        <td>38</td>
        <td>32</td>
        <td>38</td>
      </tr>

      <tr>
        <td>L</td>
        <td>40</td>
        <td>34</td>
        <td>40</td>
      </tr>

      <tr>
        <td>XL</td>
        <td>42</td>
        <td>36</td>
        <td>42</td>
      </tr>

      <tr>
        <td>XXL</td>
        <td>44</td>
        <td>38</td>
        <td>44</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
